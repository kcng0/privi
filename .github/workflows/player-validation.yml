name: Android Playback Validation

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Optional same-repository release build run ID; install its actual APK for UI smoke'
        required: false
        type: string
      subtitle_trace:
        description: 'Optional metadata-only Frida subtitle trace; diagnostic run, not performance validation; incompatible with release_run_id'
        required: false
        type: boolean
        default: false
      sdk_run_id:
        description: 'Optional temporary same-repository successful LibVLC SDK workflow run'
        required: false
        type: string
      sdk_url:
        description: 'Optional permanent GitHub Release libvlc-sdk.tar.xz URL; replaces sdk_run_id'
        required: false
        type: string
      sdk_commit:
        description: 'Required with a custom SDK: its full build-source commit'
        required: false
        type: string
      sdk_sha256:
        description: 'Required with a custom SDK: SHA-256 of its entire libvlc-sdk.tar.xz bundle'
        required: false
        type: string
  push:
    branches: [main, feat/vlc-playback]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/fonts/**'
      - 'integration_test/**'
      - 'test_driver/**'
      - 'scripts/create-playback-fixtures.sh'
      - 'scripts/run-playback-validation.sh'
      - 'scripts/trace-libvlc-subtitles.py'
      - 'scripts/playback-device-actions.py'
      - 'scripts/build-libvlc-sdk.sh'
      - 'scripts/select-libvlc-sdk.sh'
      - 'third_party/libvlc/**'
      - 'pubspec.*'
      - '.github/workflows/player-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  native-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id || '' }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      SUBTITLE_TRACE: ${{ inputs.subtitle_trace && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the pinned or explicit fixed-source LibVLC SDK
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_RUN_ID: ${{ inputs.sdk_run_id }}
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_RUN_ID" ]]; then
            if [[ -n "$SDK_RUN_ID$SDK_URL$SDK_COMMIT$SDK_SHA256" ]]; then
              echo 'error: SDK inputs cannot replace libraries in an already signed release APK' >&2
              exit 2
            fi
          else
            bash scripts/select-libvlc-sdk.sh
          fi
      - name: Validate optional diagnostic mode
        if: inputs.subtitle_trace && inputs.release_run_id != ''
        run: |
          echo '::error::subtitle_trace is incompatible with release_run_id; actual signed APK smoke must run without instrumentation'
          exit 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        if: inputs.release_run_id == ''
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: playback-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: playback-gradle-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - name: Dependencies and generated code
        if: inputs.release_run_id == ''
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build
      - name: Validate release artifact source
        if: inputs.release_run_id != ''
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
      - name: Download the actual release APK from the selected run
        if: inputs.release_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          pattern: privi-*-release
          path: build/release-under-test
      - name: Native screenshot analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes python3-pil ffmpeg
          if [[ -n "$RELEASE_RUN_ID" ]]; then sudo apt-get install --yes tesseract-ocr; fi
      - name: Serve verified synthetic codec and subtitle fixtures
        run: |
          (cd integration_test/fixtures && sha256sum -c SHA256SUMS)
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory integration_test/fixtures > "$RUNNER_TEMP/privi-fixture-server.log" 2>&1 < /dev/null &
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-privi-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native playback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Exercise production LibVLC hybrid composition and actual SurfaceView
          # screenshots; synthetic motion checks exclude Flutter controls/HUD.
          api-level: 33
          arch: x86_64
          # AOSP avoids Pixel Launcher's Google first-boot workload. The runner
          # still requires the real PiP feature and a responsive focused HOME.
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-playback-validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-validation
          path: build/playback-validation
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always() && inputs.release_run_id == '' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
